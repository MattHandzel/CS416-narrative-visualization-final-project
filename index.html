<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calendar Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .day {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .highlighted {
            fill: yellow;
        }

        .tooltip {
            position: absolute;
            text-align: center;
            width: 400px;
            height: auto;
            padding: 5px;
            background: lightsteelblue;
            border: 1px solid;
            border-radius: 8px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tooltip svg {
            margin-top: 10px;
        }

        .grid {
            font-family: "HackNerd", sans-serif;
            margin: 50px auto;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            width: 100%;
            max-width: 800px;
            background-color: #ccc;
        }

        .day,
        .header {
            padding: 10px;
            background-color: #fff;
            text-align: center;
            box-sizing: border-box;
        }

        .monthYearName {
            text-align: center;
            box-sizing: border-box;
            font-family: "HackNerd", sans-serif;
            font-size: 20px;
            margin: 50px auto;
            gap: 1px;
            width: 100%;
            max-width: 800px;
            background-color: #ccc;
        }

        .header {
            font-weight: bold;
            background-color: #f7f7f7;
        }

        .buttons {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .buttons button {
            margin: 0 10px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="buttons">
        <button id="prevMonth">Previous Month</button>
        <button id="nextMonth">Next Month</button>
    </div>
    <div id="calendar" class="calendar">
        <div id="monthYearName" class="monthYearName"></div>
        <div id="grid" class="grid"></div>
    </div>
    <div id="tooltip" class="tooltip" style="opacity: 0;">
        <div id="tooltip-text"></div>
        <div id="heart-rate-pie-chart"></div>
        <div id="time-spent-pie-chart"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
